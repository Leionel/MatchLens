[project]
name = "matchlens-api"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
  "agent-framework-core==1.22.0",
  "agent-framework-openai==1.17.0",
  "openai==3.35.1",
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "python-dotenv==1.2.4",
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx==0.28.1"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
