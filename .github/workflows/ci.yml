name: MatchLens AI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      full_corpus:
        description: "Fetch, ingest and verify the complete 80-match corpus"
        type: boolean
        default: false

jobs:
  backend-test:
    name: Backend Test Suite (Pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies from lockfile
        run: uv sync --frozen

      - name: Run Pytest test suite
        run: uv run pytest tests -v --tb=short

  real-match-integration:
    name: Real Match Integration (minimum provider corpus)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies from lockfile
        run: uv sync --frozen

      # One real provider payload proves the fetch → ingest → catalog → replay
      # path from a clean checkout. It is deliberately not the developer's
      # private 80-match corpus.
      - name: Fetch and import the minimum real corpus
        working-directory: .
        run: |
          services/api/.venv/bin/python scripts/fetch_statsbomb_open_data.py \
            --competition 55 --season 43 --match-ids 3795221
          services/api/.venv/bin/python scripts/ingest_statsbomb_corpus.py --match sb_3795221
          services/api/.venv/bin/python scripts/ingest_statsbomb_corpus.py --verify

      - name: Real-match performance gate
        working-directory: .
        run: services/api/.venv/bin/python scripts/benchmark_real_match.py

      # Container contract without Docker: COPY sources, .dockerignore, the
      # entrypoint's line endings, railway.toml, and a volume-backed import.
      - name: Verify the single-container deployment contract
        working-directory: .
        run: services/api/.venv/bin/python scripts/verify_deployment.py

      - name: Run provider integration tests
        run: |
          uv run pytest \
            tests/test_real_match_integration.py \
            tests/test_provider_publication.py \
            tests/test_provider_match_semantics.py \
            tests/test_r6_2_boundaries.py \
            -v --tb=short

  container:
    name: Container Build & Smoke (Docker)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The image is the deployment unit, so it is built and run here rather
      # than trusted. No provider payloads are in the build context; the
      # container fetches one match itself, which also exercises bootstrap.
      - name: Build the image
        run: docker build --tag matchlens:ci .

      - name: Run the container with a volume
        run: |
          docker run --detach --name matchlens-ci -p 8000:8000             --volume matchlens-ci-data:/data/matchlens matchlens:ci

      - name: Wait for the health probe
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "health check never passed"; docker logs matchlens-ci; exit 1

      - name: Check the page and the API
        run: |
          set -e
          curl -fsS http://127.0.0.1:8000/ | grep -qi "MatchLens"
          total=$(curl -fsS http://127.0.0.1:8000/api/matches             | python3 -c "import json,sys; body=json.load(sys.stdin); print(len(body.get('matches') or body))")
          echo "matches listed: $total"
          test "$total" -ge 7
          test "$(docker inspect --format '{{.State.Running}}' matchlens-ci)" = "true"

      # Best effort: the provider fetch depends on outbound network. A failure
      # here is reported, not fatal — the app is designed to keep working.
      - name: Wait for the first-run real match (best effort)
        continue-on-error: true
        run: |
          for i in $(seq 1 90); do
            ready=$(curl -fsS http://127.0.0.1:8000/api/matches | python3 -c "
          import json,sys
          body=json.load(sys.stdin); items=body.get('matches') or body
          print(len([m for m in items if m.get('analysis_ready') and m.get('provenance_kind')=='provider_payload']))
          ")
            if [ "$ready" -ge 1 ]; then echo "real match ready after ${i}s"; exit 0; fi
            sleep 2
          done
          echo "no provider match became ready; bootstrap log follows"; docker logs matchlens-ci | tail -40; exit 1

      # A Railway redeploy keeps the volume and starts a fresh container. The
      # match must still be there, and must not be re-downloaded.
      - name: The volume survives a restart
        run: |
          set -e
          docker restart matchlens-ci >/dev/null
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:8000/api/health >/dev/null 2>&1 && break
            sleep 1
          done
          ready=$(curl -fsS http://127.0.0.1:8000/api/matches | python3 -c "
          import json,sys
          body=json.load(sys.stdin); items=body.get('matches') or body
          print(len([m for m in items if m.get('analysis_ready') and m.get('provenance_kind')=='provider_payload']))
          ")
          echo "analysis-ready provider matches after restart: $ready"
          test "$ready" -ge 1
          docker logs matchlens-ci 2>&1 | tail -20

      - name: Container logs
        if: always()
        run: docker logs matchlens-ci | tail -60

  full-corpus:
    name: Full 80-Match Corpus (manual)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_corpus }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: services/api

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install dependencies from lockfile
        run: uv sync --frozen

      - name: Fetch and ingest the complete corpus
        working-directory: .
        run: |
          services/api/.venv/bin/python scripts/fetch_statsbomb_open_data.py --corpus
          services/api/.venv/bin/python scripts/ingest_statsbomb_corpus.py
          services/api/.venv/bin/python scripts/ingest_statsbomb_corpus.py --verify-all

      - name: Verify every catalogued match is analysis-ready
        working-directory: .
        run: services/api/.venv/bin/python scripts/verify_corpus.py

      - name: Run full corpus tests
        run: uv run pytest tests/test_statsbomb_corpus.py tests/test_real_match_integration.py -v --tb=short

  frontend-build:
    name: Frontend Build & Typecheck (Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run TypeScript typecheck
        run: npm run typecheck

      - name: Build Next.js application
        run: npm run build

  browser-e2e:
    name: Browser E2E & Accessibility (Playwright)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
          cache-dependency-glob: "services/api/uv.lock"

      - name: Set up Python 3.13
        run: uv python install 3.13

      - name: Install backend dependencies from lockfile
        working-directory: services/api
        run: uv sync --frozen

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/web
        run: npm ci

      # The API server mounts the exported static bundle, so the suite drives a
      # real browser against the same artefact that would be deployed.
      - name: Build Next.js application
        working-directory: apps/web
        run: npm run build

      - name: Install Playwright browsers
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      # Provider payloads are never committed, so the suite materialises the one
      # real match it asserts on. The import also proves the ingestion path
      # still works from a clean checkout. This id must stay in sync with
      # REAL_MATCH in apps/web/e2e/journey.spec.ts.
      - name: Fetch and import the provider match used by the suite
        run: |
          services/api/.venv/bin/python scripts/fetch_statsbomb_open_data.py \
            --competition 55 --season 43 --match-ids 3795221
          services/api/.venv/bin/python scripts/ingest_statsbomb_corpus.py --match sb_3795221

      - name: Run the browser suite
        working-directory: apps/web
        run: npx playwright test

      - name: Upload Playwright traces, screenshots and HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-artifacts-${{ github.run_attempt }}
          path: |
            apps/web/e2e/.artifacts
            apps/web/e2e/.playwright-report
          # Playwright's artifact/report folders start with a dot; v4 skips
          # hidden files unless this is enabled.
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
